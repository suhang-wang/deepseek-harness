name: Enterprise Windows installer (unsigned)

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version: auto generates a version; otherwise enter a full version'
        type: string
        default: auto
        required: true
      deployment:
        description: Update policy deployment
        type: choice
        options: [test, production]
        default: test
        required: true
      policy_origin:
        description: 'Required update policy HTTPS origin (no path)'
        type: string
        required: true
      login_origins:
        description: 'Required for test: comma-separated allowed login HTTPS origins'
        type: string
        required: false
      enterprise_service_origin:
        description: 'Enterprise service HTTPS origin when no company profile is provided (no path)'
        type: string
        required: false
      enterprise_profile:
        description: 'Optional non-secret company profile JSON path inside the private enterprise repository'
        type: string
        required: false
      enterprise_repository:
        description: 'Private enterprise repository holding the enterprise package set (owner/name)'
        type: string
        required: true
      enterprise_ref:
        description: 'Enterprise repository ref to check out beside this repository'
        type: string
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: windows-enterprise-desktop-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: deepseek-harness
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the harness repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
          path: deepseek-harness
      # The enterprise workspace links its dependencies as `../deepseek-harness/...`, so it must land
      # as a sibling directory for its install and build to resolve.
      - name: Check out the private enterprise repository
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.enterprise_repository }}
          ref: ${{ inputs.enterprise_ref }}
          token: ${{ secrets.ENTERPRISE_REPO_TOKEN }}
          persist-credentials: false
          clean: true
          path: deepseek-harness-enterprise
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked harness dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Install locked enterprise dependencies
        working-directory: deepseek-harness-enterprise
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Validate inputs and prepare public enterprise package settings
        id: settings
        env:
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version }}
          PACKAGE_DEPLOYMENT: ${{ inputs.deployment }}
          PACKAGE_POLICY_ORIGIN: ${{ inputs.policy_origin }}
          PACKAGE_LOGIN_ORIGINS: ${{ inputs.login_origins }}
          PACKAGE_EDITION: enterprise
        run: node apps/desktop/scripts/prepare-windows-ci.mjs
      - name: Check packaging configuration and toolchain
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
          PACKAGE_ENTERPRISE_SERVICE_ORIGIN: ${{ inputs.enterprise_service_origin }}
          PACKAGE_ENTERPRISE_PROFILE: ${{ inputs.enterprise_profile }}
        run: |
          $enterpriseArgs = if ($env:PACKAGE_ENTERPRISE_PROFILE) {
            @('--enterprise-profile', "../deepseek-harness-enterprise/$env:PACKAGE_ENTERPRISE_PROFILE")
          } else {
            @('--enterprise-service-origin', $env:PACKAGE_ENTERPRISE_SERVICE_ORIGIN)
          }
          pnpm run package:desktop:win:x64:unsigned --check --build-version "$env:PACKAGE_VERSION" --enterprise-packages ../deepseek-harness-enterprise @enterpriseArgs
          exit $LASTEXITCODE
      - name: Build installer and verify packaged runtime
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
          PACKAGE_ENTERPRISE_SERVICE_ORIGIN: ${{ inputs.enterprise_service_origin }}
          PACKAGE_ENTERPRISE_PROFILE: ${{ inputs.enterprise_profile }}
        run: |
          $enterpriseArgs = if ($env:PACKAGE_ENTERPRISE_PROFILE) {
            @('--enterprise-profile', "../deepseek-harness-enterprise/$env:PACKAGE_ENTERPRISE_PROFILE")
          } else {
            @('--enterprise-service-origin', $env:PACKAGE_ENTERPRISE_SERVICE_ORIGIN)
          }
          pnpm run package:desktop:win:x64:unsigned --build-version "$env:PACKAGE_VERSION" --enterprise-packages ../deepseek-harness-enterprise @enterpriseArgs
          exit $LASTEXITCODE
      - name: Retain packaging diagnostics
        if: always() && steps.settings.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-enterprise-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: deepseek-harness/apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-enterprise-x64-unsigned-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            deepseek-harness/apps/desktop/.desktop-build/enterprise/targets/win-x64/unsigned-artifacts/*.exe
            deepseek-harness/apps/desktop/.desktop-build/enterprise/companies/*/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Remove generated package settings
        if: always() && steps.settings.outcome == 'success'
        run: |
          if (Test-Path -LiteralPath apps/desktop/.env.windows) {
            Remove-Item -LiteralPath apps/desktop/.env.windows
          }
